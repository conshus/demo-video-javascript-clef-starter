<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://video.standard.vonage.com/v2/js/opentok.min.js"></script>
</head>

<body>

  <div class="dashboard-layout">
    <main class="dashboard-main">
      <header>
        <h2>Active Support Call</h2>
        <div id="agent-video-controls" style="display: none; gap: 0.5rem;">
          <button id="agent-toggle-audio"
            style="background: var(--surface); color: var(--text); border: 1px solid var(--border);">Mute</button>
          <button id="agent-toggle-video"
            style="background: var(--surface); color: var(--text); border: 1px solid var(--border);">Stop
            Camera</button>
          <button id="agent-end-call" class="btn-danger">End Call</button>
        </div>
      </header>
      <section class="video-layout">
        <div id="subscriber-container" class="video-box">Waiting for customer stream...</div>
        <div id="publisher-container" class="video-box">Your camera</div>
      </section>
    </main>

    <aside class="dashboard-sidebar">
      <h3>Escalation Queue</h3>
      <hr style="margin: 1rem 0; border: none; border-top: 1px solid var(--border-color);">
      <div id="dashboard-alerts" aria-live="polite">
        <!-- JS injects escalation cards here -->
      </div>
    </aside>
  </div>

  <script src="dashboard.js"></script>
</body>

</html>
